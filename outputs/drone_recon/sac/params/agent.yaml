seed: 1
models:
  policy:
    clip_actions: false
    clip_log_std: true
    min_log_std: -20.0
    max_log_std: 2.0
    network:
    - layers:
      - 256
      - 256
      - 256
      activations: elu
  critic:
    clip_actions: false
    network:
    - layers:
      - 256
      - 256
      - 256
      activations: elu
agent:
  memory_size: 100
  batch_size: 256
  gradient_steps: 1
  discount_factor: 0.99
  polyak: 0.005
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  entropy_learning_rate: 0.0003
  initial_entropy_value: 0.2
  target_entropy: null
  learn_entropy: true
  random_timesteps: 1000
  learning_starts: 1000
  grad_norm_clip: 1.0
  experiment:
    directory: /home/ic3/ic3/drfm/outputs/drone_recon
    experiment_name: sac
    write_interval: 1000
    checkpoint_interval: 0
trainer:
  timesteps: 5000
  environment_info: metrics
  close_environment_at_exit: false
